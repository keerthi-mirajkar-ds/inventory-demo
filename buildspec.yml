version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-2
    IMAGE_REPO_NAME: inventory-app
    CONTAINER_NAME: inventory-task

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Starting CodeBuild for commit $CODEBUILD_RESOLVED_SOURCE_VERSION"

  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPOSITORY_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG=latest; fi
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - if [ -f pom.xml ] && [ -f Dockerfile ]; then APP_DIR=.; elif [ -f demo/pom.xml ] && [ -f demo/Dockerfile ]; then APP_DIR=demo; else echo "ERROR: Could not find pom.xml and Dockerfile in root or demo/"; exit 1; fi
      - echo "Using app directory: $APP_DIR"
      - mvn -f $APP_DIR/pom.xml clean package -DskipTests
      - docker build -f $APP_DIR/Dockerfile -t $REPOSITORY_URI:$IMAGE_TAG $APP_DIR
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest

  post_build:
    commands:
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
